[tools]
python = "3.13"
uv = "latest"
bun = "latest"
"aqua:cocogitto/cocogitto" = "7.0.0"  # cog: conventional-commit version bumps in CI

[env]
_.python.venv = { path = ".venv", create = true }
HASKIE_HOME = "{{ env.HASKIE_HOME | default(value=env.HOME ~ '/.haskie') }}"

[task_config]
includes = ["mise/tasks"]
