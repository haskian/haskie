name: Version

# On push to main: a conventional-commit SemVer bump (cog) writes CHANGELOG.md and cuts the tag,
# then the wheel built from that tag is attached to a GitHub Release.
#
# Requires main to accept pushes from github-actions[bot] — a bot bypass on the branch protection
# rule, or an unprotected main. Requires squash-only merges too, so one commit on main equals one
# PR title, the subject the increment is read from.
on:
  push:
    branches: [main]

# Never two bumps at once: the second would compute its next version from a tag the first has not
# pushed yet, and both would claim the same one.
concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write # push the bump commit, the changelog and the tag back to main

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cog reads every commit back to the last tag
      - uses: jdx/mise-action@v2
      - id: bump
        run: mise run bump

  dist:
    name: Build wheel + sdist
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      # The tag, not this run's ref: that is the commit before the bump, and would build the
      # previous version's tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.version }}
      - uses: jdx/mise-action@v2
      # No `mise run setup`: `dist` builds the web itself and `uv build`/`smoke` use isolated
      # envs, so a project `uv sync` would be pure waste here.
      - run: mise run dist
      # An artifact that cannot be installed fails in the adopter's environment, not here.
      - run: mise run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # The wheel + sdist attached here are what `uv tool install haskie --from <release-url>` reads.
  release:
    name: GitHub Release
    needs: [bump, dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.version }}
          files: dist/*
          generate_release_notes: true
