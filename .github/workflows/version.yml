name: Version

# On push to main: a SemVer bump (cog) writes CHANGELOG.md and cuts the tag, then release.yml
# builds the wheel from that tag and attaches it to a GitHub Release.
#
# Every push to main gets a version, so no version is skipped: the commit subjects decide the
# increment, and a push whose subjects imply none takes a patch. Only a `majorfeat!` subject takes
# the major digit up — see `mise/tasks/bump` for the rules and AGENTS.md for how to write one.
#
# Requires main to accept pushes from github-actions[bot] — a bot bypass on the branch protection
# rule, or an unprotected main. Requires squash-only merges too, so one commit on main equals one
# PR title, the subject the increment is read from.
on:
  push:
    branches: [main]

# Never two bumps at once: the second would compute its next version from a tag the first has not
# pushed yet, and both would claim the same one.
concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write # push the bump commit, the changelog and the tag back to main

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cog reads every commit back to the last tag
      - uses: jdx/mise-action@v2
      - id: bump
        run: mise run bump

  # Same jobs a hand-pushed `v*` tag runs. Called, not triggered: GitHub does not start a workflow
  # from a tag pushed with GITHUB_TOKEN. Inherits `contents: write` for the GitHub Release.
  release:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.bump.outputs.version }}
