name: PR title

# Squash-only merges make the PR title the one commit subject on main, which is what the bump
# reads. Verifying the title here is what lets version.yml trust that subject.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The conventional set, plus the one type this project adds: `majorfeat!` is what takes
          # the major digit up (see `mise/tasks/bump`). Listing any type means listing them all.
          types: |
            majorfeat
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
