name: PR title

# Squash-only merges make the PR title the one commit subject on main, which is what the bump
# reads. Verifying the title here is what lets version.yml trust that subject.
on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
