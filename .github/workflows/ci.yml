name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs the full suite before publishing

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless. `github.workflow` keeps the run
# release.yml calls apart from the branch's own run: a called workflow keeps the caller's ref, so
# grouping on the ref alone would have the release cancel the push it was released from.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The wheel is pure-Python (`py3-none-any`), so no OS decides the artifact — but the native
  # runtime deps (fastembed, lancedb) do differ per OS, so the suite runs on both.
  check:
    name: check + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs python, uv and bun from mise.toml, with caching.
      - uses: jdx/mise-action@v2
      - run: mise run setup
      - run: mise run check # ruff + ty + oxlint + tsc, read-only
      # Skip the cpu_budget tests: they need a pipeline budget above what a small CI runner gives
      # (see the marker in pyproject.toml). `-m` on the command line replaces the addopts default,
      # so `not network` is repeated here.
      - run: mise run test -- -m "not network and not cpu_budget"
