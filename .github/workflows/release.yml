name: Release

# Tag-driven. Every `v*` tag builds the wheel + sdist, publishes them to PyPI, and cuts a GitHub
# Release with them attached, so it installs with `uv tool install haskie`.
on:
  push:
    tags: ["v*"]
  # version.yml dispatches this on the tag it cuts. It cannot rely on the tag push above: GitHub
  # starts no workflow from a ref pushed with GITHUB_TOKEN, except through a dispatch. A dispatch,
  # not a `workflow_call`, because PyPI's trusted publishing refuses a reusable workflow.
  workflow_dispatch:

permissions:
  contents: read

# The tag, on a tag push and on a dispatch with `--ref <tag>`.
env:
  BUILD_REF: ${{ github.ref_name }}

jobs:
  # Publishing an artifact that fails its own test suite is not worth the convenience. Neither
  # path into here is covered otherwise: version.yml pushes the bump commit with `[skip ci]`, and
  # a hand-pushed tag starts no suite of its own.
  ci:
    uses: ./.github/workflows/ci.yml

  dist:
    name: Build wheel + sdist
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: jdx/mise-action@v2
      # No `mise run setup`: `dist` builds the web itself and `uv build`/`smoke` use isolated
      # envs. BUILD_REF makes `dist` refuse a tag that disagrees with the tree's declared version.
      - run: mise run dist
      # An artifact that cannot be installed fails in the adopter's environment, not here.
      - run: mise run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    name: GitHub Release
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach artifacts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_REF }}
          files: dist/*
          generate_release_notes: true

  # PyPI's trusted publisher for this project names release.yml and the `pypi` environment.
  pypi:
    name: PyPI
    needs: dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
