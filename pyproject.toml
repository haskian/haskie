[project]
name = "haskie"
version = "0.20.0"
description = "Personal document collections: markdown conversion, LanceDB search, web UI and MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litestar[standard]>=2.23.0",
    "litestar-mcp>=0.13.2",
    "lancedb>=0.38.0",
    "msgspec>=0.19.0",
    "pydantic-graph>=2.48.0",
    "firecrawl-anydoc>=0.2.4",
    "pdf-inspector>=1.20.0",
    "pyromark>=0.9.13",
    "pypdf>=5.0.0",
    # ONNX Runtime's CUDA build by default on Linux; it runs on the CPU where no NVIDIA GPU is. Never
    # both builds: each ships the `onnxruntime` package, so whichever installs last overwrites the
    # other's files, and an install that ends with the CPU build's has no CUDA at all.
    "fastembed>=0.8.0 ; sys_platform == 'darwin'",
    "fastembed-gpu>=0.8.0 ; sys_platform != 'darwin'",
    # The Apple GPU on Apple Silicon: MLX rerankers and embedders (`indexing/mlx_models.py`), and
    # the GGUF embedders on llama.cpp (`indexing/gguf_models.py`). PyPI ships llama-cpp-python as
    # source only, so installing it compiles llama.cpp with Metal (about a minute; needs the Xcode
    # command-line tools).
    "mlx-embeddings>=0.1 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "llama-cpp-python>=0.3.35 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "semantic-text-splitter>=0.32.0",
    "aiosqlite>=0.21.0",
    "sqlalchemy[asyncio]>=2.0.43",
    "dbos>=3.0.0",
    "structlog>=25.1.0",
    "typer>=0.15.0",
    "unicode-segmentation-rs>=0.3.3",
    "numpy>=2.0",
    "pebble>=5.2.2",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
haskie = "haskie.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9.0",
    "ty>=0.0.81",
]

# The built UI, put here by `mise run build` (see its task description).
[tool.uv.build-backend]
source-include = ["src/haskie/web/**"]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# Installed on Apple Silicon only, so Linux, and CI on Linux, have none of them.
# Typed as Any everywhere, installed or not, so the check says the same on every machine.
replace-imports-with-any = [
    "mlx.**",
    "mlx_embeddings.**",
    "transformers.**",
    "llama_cpp.**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads models from Hugging Face"]
addopts = "-m 'not network'"
